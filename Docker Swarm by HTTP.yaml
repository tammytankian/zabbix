            - uuid: b5bac77839a247e4b5bcfc1650fe6df8
              name: 'Network {#NETWORK.NAME}: container list'
              type: DEPENDENT
              key: 'docker.network.container_list[{#NETWORK.ID}]'
              value_type: TEXT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var list = [];
                      var containers = data.Containers || {};
                      for (var id in containers) {
                        list.push(containers[id].Name + " (" + containers[id].IPv4Address + ")");
                      }
                      return list.join(", ");
              master_item:
                key: 'docker.network.raw[{#NETWORK.ID}]'
              tags:
