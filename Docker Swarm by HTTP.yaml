zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 3981b01129274fe5be91f85f647c5931
      name: Templates/Containers
  templates:
    - uuid: 05ec84cf27f74ae7b4ff85fad48bf13f
      template: 'Docker Swarm by HTTP'
      name: 'Docker Swarm by HTTP'
      description: |
        Docker & Docker Swarm monitoring via HTTP agent (no SSL).
        Expects Docker API on http://{HOST.CONN}:2375.
        
        Collects:
        - Global Docker info (info/version/ping/container counts)
        - Containers LLD: stats, inspect, CPU/mem/net/block I/O, restart count
        - Swarm nodes LLD: role, availability, state, reachability
        - Swarm services LLD: mode, desired replicas, running tasks
        - Networks LLD
        - Volumes LLD
      groups:
        - name: Templates/Containers
      items:
        - uuid: aa2019545aaa494dac812b35f6a71e05
          name: 'Docker: containers list (raw JSON)'
          type: HTTP_AGENT
          key: docker.containers.list.raw
          history: 1h
          value_type: TEXT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 5m
          timeout: 1m
          url: '{$DOCKER.API.BASE}/containers/json?all=1'
          tags:
            - tag: application
              value: docker
            - tag: component
              value: docker
            - tag: scope
              value: node
            - tag: type
              value: raw
        - uuid: 3eaaa3d275b146308c0e442f7bfbe460
          name: 'Docker: paused containers'
          type: DEPENDENT
          key: docker.containers.paused
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ContainersPaused
          master_item:
            key: docker.info.raw
          tags:
            - tag: application
              value: docker
            - tag: component
              value: containers
            - tag: scope
              value: node
        - uuid: f71c4421284e40df8e0297697f5bf568
          name: 'Docker: running containers'
          type: DEPENDENT
          key: docker.containers.running
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ContainersRunning
          master_item:
            key: docker.info.raw
          tags:
            - tag: application
              value: docker
            - tag: component
              value: containers
            - tag: scope
              value: node
        - uuid: 0d95be7abf5d477ba2cdf2e77c233377
          name: 'Docker: stopped containers'
          type: DEPENDENT
          key: docker.containers.stopped
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ContainersStopped
          master_item:
            key: docker.info.raw
          tags:
            - tag: application
              value: docker
            - tag: component
              value: containers
            - tag: scope
              value: node
        - uuid: 42d0483fa94946a6ad85431ff0e1ef47
          name: 'Docker: total containers'
          type: DEPENDENT
          key: docker.containers.total
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Containers
          master_item:
            key: docker.info.raw
          tags:
            - tag: application
              value: docker
            - tag: component
              value: containers
            - tag: scope
              value: node
        - uuid: d71e084c77c342578b394b0e1aced86d
          name: 'Docker: total images'
          type: DEPENDENT
          key: docker.images.total
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Images
          master_item:
            key: docker.info.raw
          tags:
            - tag: application
              value: docker
            - tag: component
              value: containers
            - tag: scope
              value: node
        - uuid: 3ea450f0aa164b79ae8abb6593dddf69
          name: 'Docker: info (raw JSON)'
          type: HTTP_AGENT
          key: docker.info.raw
          history: 1h
          value_type: TEXT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 5m
          timeout: 1m
          url: '{$DOCKER.API.BASE}/info'
          tags:
            - tag: application
              value: docker
            - tag: component
              value: docker
            - tag: scope
              value: node
            - tag: type
              value: raw
        - uuid: 58c0fe05480448d9a2d3132e75ac14fd
          name: 'Docker: logging driver'
          type: DEPENDENT
          key: docker.logging_driver
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.LoggingDriver
          master_item:
            key: docker.info.raw
          tags:
            - tag: application
              value: docker
            - tag: component
              value: docker
            - tag: scope
              value: node
        - uuid: 1e4d34e0013344f9b35095cb190dd7e2
          name: 'Docker: ping'
          type: HTTP_AGENT
          key: docker.ping
          delay: 30s
          history: 7d
          value_type: TEXT
          timeout: 1m
          url: '{$DOCKER.API.BASE}/_ping'
          tags:
            - tag: application
              value: docker
            - tag: component
              value: docker
            - tag: scope
              value: node
            - tag: type
              value: raw
        - uuid: 2e9957e895614b39af87f188898aa6c9
          name: 'Docker: storage driver'
          type: DEPENDENT
          key: docker.storage_driver
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Driver
          master_item:
            key: docker.info.raw
          tags:
            - tag: application
              value: docker
            - tag: component
              value: docker
            - tag: scope
              value: node
        - uuid: 7cfdaefc633b4e73a835dee461416fba
          name: 'Docker: swarm cluster ID'
          type: DEPENDENT
          key: docker.swarm.cluster_id
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Swarm.Cluster.ID
              error_handler: CUSTOM_VALUE
          master_item:
            key: docker.info.raw
          tags:
            - tag: application
              value: docker
            - tag: component
              value: swarm
            - tag: scope
              value: cluster
        - uuid: 970bf565d01b47ef9d5888343767860b
          name: 'Docker: swarm cluster name'
          type: DEPENDENT
          key: docker.swarm.cluster_name
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Swarm.Cluster.Spec.Name
              error_handler: CUSTOM_VALUE
          master_item:
            key: docker.info.raw
          tags:
            - tag: application
              value: docker
            - tag: component
              value: swarm
            - tag: scope
              value: cluster
        - uuid: 093595e182ca4f328e1b2e075abe4d5c
          name: 'Docker: swarm enabled'
          type: DEPENDENT
          key: docker.swarm.enabled
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Swarm.LocalNodeState
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = value.replace(/"/g, '').toLowerCase();
                  return v === 'active' ? 1 : 0;
          master_item:
            key: docker.info.raw
          tags:
            - tag: application
              value: docker
            - tag: component
              value: swarm
            - tag: scope
              value: cluster
        - uuid: 906acca0bc1546c48f321bdae78e73f1
          name: 'Docker: swarm local node state'
          type: DEPENDENT
          key: docker.swarm.local_node_state
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Swarm.LocalNodeState
          master_item:
            key: docker.info.raw
          tags:
            - tag: application
              value: docker
            - tag: component
              value: swarm
            - tag: scope
              value: node
        - uuid: f5b5fb50e16542529fd0802faf80ad22
          name: 'Docker: swarm managers total'
          type: DEPENDENT
          key: docker.swarm.managers.total
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Swarm.Managers
          master_item:
            key: docker.info.raw
          tags:
            - tag: application
              value: docker
            - tag: component
              value: swarm
            - tag: scope
              value: cluster
        - uuid: 156fa0797903491a9baacad60047af12
          name: 'Docker: swarm nodes total'
          type: DEPENDENT
          key: docker.swarm.nodes.total
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Swarm.Nodes
          master_item:
            key: docker.info.raw
          tags:
            - tag: application
              value: docker
            - tag: component
              value: swarm
            - tag: scope
              value: cluster
        - uuid: 4182761458a94a3f9e561bd4b59766a4
          name: 'Docker: swarm node address'
          type: DEPENDENT
          key: docker.swarm.node_addr
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Swarm.NodeAddr
              error_handler: CUSTOM_VALUE
          master_item:
            key: docker.info.raw
          tags:
            - tag: application
              value: docker
            - tag: component
              value: swarm
            - tag: scope
              value: cluster
        - uuid: 55bec67d4b9743b6a17f54075223d6ec
          name: 'Docker: version (raw JSON)'
          type: HTTP_AGENT
          key: docker.version.raw
          delay: 10m
          history: 1h
          value_type: TEXT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 5m
          timeout: 1m
          url: '{$DOCKER.API.BASE}/version'
          tags:
            - tag: application
              value: docker
            - tag: component
              value: docker
            - tag: scope
              value: node
            - tag: type
              value: raw
        - uuid: 8fb23b147b1c4be98e68553895428f1c
          name: 'Docker: server version'
          type: DEPENDENT
          key: docker.version.server
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ServerVersion
          master_item:
            key: docker.info.raw
          tags:
            - tag: application
              value: docker
            - tag: component
              value: docker
            - tag: scope
              value: node
      discovery_rules:
        - uuid: 24185dc3358f432084099705eb29edcd
          name: 'Docker: containers discovery'
          type: DEPENDENT
          key: docker.containers.discovery
          item_prototypes:
            - uuid: 61cbc2fbfe9849fca99641c28ddf6a01
              name: 'Container {#NAME}: block I/O read bytes'
              type: DEPENDENT
              key: 'docker.container.block_read_bytes[{#ID}]'
              units: B
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var stats = JSON.parse(value);
                      var blkio = stats.blkio_stats && stats.blkio_stats.io_service_bytes_recursive  || [];
                      var sum = 0;
                      for (var i = 0; i < blkio.length; i++) {
                        if  (blkio[i].op === 'Read' && blkio[i].value) sum += blkio[i].value;
                       }
                      return sum;
              master_item:
                key: 'docker.container.stats.raw[{#ID}]'
              tags:
                - tag: app
                  value: '{#APP}'
                - tag: application
                  value: docker
                - tag: component
                  value: container
                - tag: container_name
                  value: '{#NAME}'
                - tag: project
                  value: '{#PROJECT}'
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: 15a8483a9ed946769367a2fe1491dc93
              name: 'Container {#NAME}: block I/O write bytes'
              type: DEPENDENT
              key: 'docker.container.block_write_bytes[{#ID}]'
              units: B
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var stats = JSON.parse(value);
                      var blkio = stats.blkio_stats && stats.blkio_stats.io_service_bytes_recursive  || [];
                      var sum = 0;
                      for (var i = 0; i < blkio.length; i++) {
                        if  (blkio[i].op === 'Write' && blkio[i].value) sum += blkio[i].value;
                       }
                      return sum;
              master_item:
                key: 'docker.container.stats.raw[{#ID}]'
              tags:
                - tag: app
                  value: '{#APP}'
                - tag: application
                  value: docker
                - tag: component
                  value: container
                - tag: container_name
                  value: '{#NAME}'
                - tag: project
                  value: '{#PROJECT}'
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: 5d9451a56abc4396ab3fd9f012bd3c90
              name: 'Container {#NAME}: CPU usage %'
              type: DEPENDENT
              key: 'docker.container.cpu_pct[{#ID}]'
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var stats = JSON.parse(value);
                      if (!stats.cpu_stats || !stats.precpu_stats)  return 0;
                      var cpuDelta = stats.cpu_stats.cpu_usage.total_usage - stats.precpu_stats.cpu_usage.total_usage;
                       var systemDelta = stats.cpu_stats.system_cpu_usage - stats.precpu_stats.system_cpu_usage;
                       var cores = stats.cpu_stats.online_cpus
                                  || (stats.cpu_stats.cpu_usage  && stats.cpu_stats.cpu_usage.percpu_usage
                                      ? stats.cpu_stats.cpu_usage.percpu_usage.length
                                       : 1);
                      if (systemDelta > 0 && cpuDelta > 0) {
                        return  +(cpuDelta / systemDelta * cores * 100).toFixed(2);
                      }
                      return 0;
              master_item:
                key: 'docker.container.stats.raw[{#ID}]'
              tags:
                - tag: app
                  value: '{#APP}'
                - tag: application
                  value: docker
                - tag: component
                  value: container
                - tag: container_name
                  value: '{#NAME}'
                - tag: project
                  value: '{#PROJECT}'
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
              trigger_prototypes:
                - uuid: 4180b252519648afbb941932d75e581e
                  expression: 'avg(/Docker Swarm by HTTP/docker.container.cpu_pct[{#ID}],5m)>80'
                  name: 'Container {#NAME}: high CPU usage'
                  priority: WARNING
            - uuid: cd16ffb0e6004c8eb4a43ee69dbca48f
              name: 'Container {#NAME}: inspect (raw JSON)'
              type: HTTP_AGENT
              key: 'docker.container.inspect.raw[{#ID}]'
              delay: 2m
              history: '{$RAWHISTORY}'
              value_type: TEXT
              url: '{$DOCKER.API.BASE}/containers/{#ID}/json'
              tags:
                - tag: app
                  value: '{#APP}'
                - tag: application
                  value: docker
                - tag: component
                  value: container
                - tag: container_name
                  value: '{#NAME}'
                - tag: project
                  value: '{#PROJECT}'
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
                - tag: type
                  value: raw
            - uuid: 0da4654e7ae0416c86c029887f003847
              name: 'Container {#NAME}: memory limit'
              type: DEPENDENT
              key: 'docker.container.mem_limit_bytes[{#ID}]'
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.memory_stats.limit
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'docker.container.stats.raw[{#ID}]'
              tags:
                - tag: app
                  value: '{#APP}'
                - tag: application
                  value: docker
                - tag: component
                  value: container
                - tag: container_name
                  value: '{#NAME}'
                - tag: project
                  value: '{#PROJECT}'
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: 9d8f67563eef463eb95f9aa489fdddf3
              name: 'Container {#NAME}: memory usage %'
              type: DEPENDENT
              key: 'docker.container.mem_pct[{#ID}]'
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var stats = JSON.parse(value);
                      if (!stats.memory_stats || !stats.memory_stats.usage || !stats.memory_stats.limit) return 0;
                      return +(stats.memory_stats.usage / stats.memory_stats.limit * 100).toFixed(2);
              master_item:
                key: 'docker.container.stats.raw[{#ID}]'
              tags:
                - tag: app
                  value: '{#APP}'
                - tag: application
                  value: docker
                - tag: component
                  value: container
                - tag: container_name
                  value: '{#NAME}'
                - tag: project
                  value: '{#PROJECT}'
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
              trigger_prototypes:
                - uuid: a7364e903f8848dd8125757d0b51d0af
                  expression: 'avg(/Docker Swarm by HTTP/docker.container.mem_pct[{#ID}],5m)>80'
                  name: 'Container {#NAME}: high memory usage'
                  priority: WARNING
            - uuid: 439c8ac964244a38964eec6283b4671d
              name: 'Container {#NAME}: memory usage'
              type: DEPENDENT
              key: 'docker.container.mem_usage_bytes[{#ID}]'
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.memory_stats.usage
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'docker.container.stats.raw[{#ID}]'
              tags:
                - tag: app
                  value: '{#APP}'
                - tag: application
                  value: docker
                - tag: component
                  value: container
                - tag: container_name
                  value: '{#NAME}'
                - tag: project
                  value: '{#PROJECT}'
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: 95402ac9a8fe42429416e31bfc99d6e7
              name: 'Container {#NAME}: RX bytes per second'
              type: DEPENDENT
              key: 'docker.container.net_rx_bps[{#ID}]'
              value_type: FLOAT
              units: Bps
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var stats = JSON.parse(value);
                      var networks = stats.networks || {};
                      var sum = 0;
                      for (var n in networks) {
                        if (networks[n] && networks[n].rx_bytes) sum += networks[n].rx_bytes;
                      }
                      return sum;
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'docker.container.stats.raw[{#ID}]'
              tags:
                - tag: app
                  value: '{#APP}'
                - tag: application
                  value: docker
                - tag: component
                  value: container
                - tag: container_name
                  value: '{#NAME}'
                - tag: project
                  value: '{#PROJECT}'
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: ff7803dca4944215ab40394538d01626
              name: 'Container {#NAME}: net RX bytes'
              type: DEPENDENT
              key: 'docker.container.net_rx_bytes[{#ID}]'
              units: B
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var stats = JSON.parse(value);
                      var networks = stats.networks || {};
                       var sum = 0;
                      for (var n in networks) {
                        if (networks[n] && networks[n].rx_bytes)  sum += networks[n].rx_bytes;
                      }
                      return sum;
              master_item:
                key: 'docker.container.stats.raw[{#ID}]'
              tags:
                - tag: app
                  value: '{#APP}'
                - tag: application
                  value: docker
                - tag: component
                  value: container
                - tag: container_name
                  value: '{#NAME}'
                - tag: project
                  value: '{#PROJECT}'
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: 9db495b4861a4ee19683cd28316bf1c0
              name: 'Container {#NAME}: RX bytes per second'
              type: DEPENDENT
              key: 'docker.container.net_tx_bps[{#ID}]'
              value_type: FLOAT
              units: Bps
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var stats = JSON.parse(value);
                      var networks = stats.networks || {};
                      var sum = 0;
                      for (var n in networks) {
                        if (networks[n] && networks[n].tx_bytes) sum += networks[n].tx_bytes;
                      }
                      return sum;
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'docker.container.stats.raw[{#ID}]'
              tags:
                - tag: app
                  value: '{#APP}'
                - tag: application
                  value: docker
                - tag: component
                  value: container
                - tag: container_name
                  value: '{#NAME}'
                - tag: project
                  value: '{#PROJECT}'
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: a346460464854a319827cb735457f9cf
              name: 'Container {#NAME}: net TX bytes'
              type: DEPENDENT
              key: 'docker.container.net_tx_bytes[{#ID}]'
              units: B
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var stats = JSON.parse(value);
                      var networks = stats.networks || {};
                       var sum = 0;
                      for (var n in networks) {
                        if (networks[n] && networks[n].tx_bytes)  sum += networks[n].tx_bytes;
                      }
                      return sum;
              master_item:
                key: 'docker.container.stats.raw[{#ID}]'
              tags:
                - tag: app
                  value: '{#APP}'
                - tag: application
                  value: docker
                - tag: component
                  value: container
                - tag: container_name
                  value: '{#NAME}'
                - tag: project
                  value: '{#PROJECT}'
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: 8c592d6b434140c79df5f3687c07b8f5
              name: 'Container {#NAME}: restart count'
              type: DEPENDENT
              key: 'docker.container.restart_count[{#ID}]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.RestartCount
              master_item:
                key: 'docker.container.inspect.raw[{#ID}]'
              tags:
                - tag: app
                  value: '{#APP}'
                - tag: application
                  value: docker
                - tag: component
                  value: container
                - tag: container_name
                  value: '{#NAME}'
                - tag: project
                  value: '{#PROJECT}'
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: 1314020f36104cab95cc47ac469fd411
              name: 'Container {#NAME}: running'
              type: DEPENDENT
              key: 'docker.container.running[{#ID}]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.Running
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = value.toString().toLowerCase();
                      return v === 'true' ? 1 : 0;
              master_item:
                key: 'docker.container.inspect.raw[{#ID}]'
              tags:
                - tag: app
                  value: '{#APP}'
                - tag: application
                  value: docker
                - tag: component
                  value: container
                - tag: container_name
                  value: '{#NAME}'
                - tag: project
                  value: '{#PROJECT}'
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
              trigger_prototypes:
                - uuid: f7fd2c9170f643d1b40f25c734b57af0
                  expression: 'last(/Docker Swarm by HTTP/docker.container.running[{#ID}])=0'
                  name: 'Container {#NAME} is not running'
                  priority: HIGH
            - uuid: 2b587634f0b44dd0bbb6e01a34a26af8
              name: 'Container {#NAME}: state'
              type: DEPENDENT
              key: 'docker.container.state[{#ID}]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.State.Status
              master_item:
                key: 'docker.container.inspect.raw[{#ID}]'
              tags:
                - tag: app
                  value: '{#APP}'
                - tag: application
                  value: docker
                - tag: component
                  value: container
                - tag: container_name
                  value: '{#NAME}'
                - tag: project
                  value: '{#PROJECT}'
                - tag: service
                  value: '{#SERVICE}'
                - tag: stack
                  value: '{#STACK}'
            - uuid: 287e9a2a60704523a496e0d3a5693c74
              name: 'Container {#NAME}: stats (raw JSON)'
              type: HTTP_AGENT
