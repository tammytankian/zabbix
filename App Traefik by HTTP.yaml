zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: aa8e704a8229434abf25b58f98161f62
      name: Templates/Applications
  templates:
    - uuid: 9ecb9408bf0f4445b217e75ea5e24d00
      template: 'App Traefik by HTTP'
      name: 'App Traefik by HTTP'
      description: |
        Make sure your traefik config file has those parameters, so zabbix can collect the metrics:
        
        entryPoints:
          websecure:
            address: ":443"
          dashboard:
            address: ":8443"
          api-internal:
            address: ":80"
        
        api:
          dashboard: true
        
        metrics:
          prometheus:
            addEntryPointsLabels: true
            addServicesLabels: true
            addRoutersLabels: true
            entryPoint: api-internal
        
        ping:
          entryPoint: api-internal
      groups:
        - name: Templates/Applications
      items:
        - uuid: 35569595148c4ecbbe7c7b555ef30dd8
          name: 'Traefik: StripPrefix middlewares count'
          type: DEPENDENT
          key: traefik.api.middleware.stripprefix.count
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var root = JSON.parse(value);
                  var mws = root.middlewares || {};
                  var count = 0;
                  
                  for (var m in mws) {
                    if (!mws.hasOwnProperty(m)) continue;
                    if (mws[m].stripPrefix) count++;
                  }
                  
                  return count;
          master_item:
            key: traefik.api.rawdata
          tags:
            - tag: component
              value: middleware
            - tag: data
              value: api
        - uuid: daf1f30bd3214311876b58868323fd2f
          name: 'Traefik: /api/rawdata'
          type: HTTP_AGENT
          key: traefik.api.rawdata
          history: '0'
          value_type: TEXT
          description: 'Raw JSON from Traefik /api/rawdata endpoint.'
          timeout: '{$TRAEFIK.HTTP.TIMEOUT}'
          url: '{$TRAEFIK.API.SCHEME}://{$TRAEFIK.API.HOST}:{$TRAEFIK.API.PORT}{$TRAEFIK.API.PATH}/api/rawdata'
          tags:
            - tag: component
              value: api
            - tag: type
              value: raw
          triggers:
            - uuid: 324acecd046a4154966c3bffb15f6bf8
              expression: 'nodata(/App Traefik by HTTP/traefik.api.rawdata,{$TRAEFIK.API.NODATA})=1'
              name: 'Traefik: no data from /api/rawdata'
              priority: WARNING
              description: 'Zabbix has not received data from /api/rawdata for configured time.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 20ec3c25b0f94aa4ab10c2bb8968024f
          name: 'Traefik: routers without middlewares'
          type: DEPENDENT
          key: traefik.api.routers.nomiddleware.count
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var root = JSON.parse(value);
                  var routers = root.routers || {};
                  var count = 0;
                  
                  for (var r in routers) {
                    if (!routers.hasOwnProperty(r)) continue;
                    var mws = routers[r].middlewares;
                    if (!Array.isArray(mws) || mws.length === 0) {
                      count++;
                    }
                  }
                  
                  return count;
          master_item:
            key: traefik.api.rawdata
          tags:
            - tag: component
              value: middleware
            - tag: component
              value: router
            - tag: data
              value: api
        - uuid: 513188b942b04717a60cdfda89b48a1a
          name: 'Traefik: routers without TLS on websecure'
          type: DEPENDENT
          key: traefik.api.routers.notls.websecure.count
          history: 30d
          description: 'Number of HTTP routers defined in Traefik.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var root = JSON.parse(value);
                  var routers = root.routers || {};
                  var count = 0;
                  
                  for (var r in routers) {
                    if (!routers.hasOwnProperty(r)) continue;
                  
                    var rt = routers[r];
                    var eps = rt.entryPoints || [];
                  
                    if (eps.indexOf("websecure") !== -1) {
                      if (!rt.tls || Object.keys(rt.tls).length === 0) {
                        count++;
                      }
                    }
                  }
                  
                  return count;
          master_item:
            key: traefik.api.rawdata
          tags:
            - tag: component
              value: router
            - tag: data
              value: api
        - uuid: f068ca1593944a2ca8c604bec5ed9a71
          name: 'Traefik: routers per entrypoint (map)'
          type: DEPENDENT
          key: traefik.api.routers.per.entrypoint.map
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var root = JSON.parse(value);
                  var routers = root.routers || {};
                  var result = {};
                  
                  for (var r in routers) {
                    if (!routers.hasOwnProperty(r)) continue;
                    var eps = routers[r].entryPoints || [];
                    for (var i = 0; i < eps.length; i++) {
                      var ep = eps[i];
                      if (!result[ep]) result[ep] = 0;
                      result[ep]++;
                    }
                  }
                  
                  return JSON.stringify(result);
          master_item:
            key: traefik.api.rawdata
          tags:
            - tag: component
              value: router
            - tag: data
              value: api
        - uuid: 3055c2e4209047829622520c473253e7
          name: 'Traefik: routers using StripPrefix'
          type: DEPENDENT
          key: traefik.api.routers.using.stripprefix.count
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var root = JSON.parse(value);
                  var routers = root.routers || {};
                  var mws = root.middlewares || {};
                  var stripMws = {};
                  
                  for (var m in mws) {
                    if (mws[m].stripPrefix) stripMws[m] = true;
                  }
                  
                  var count = 0;
                  for (var r in routers) {
                    if (!routers.hasOwnProperty(r)) continue;
                    var mids = routers[r].middlewares || [];
                    for (var i = 0; i < mids.length; i++) {
                      if (stripMws[mids[i]]) {
                        count++;
                        break;
                      }
                    }
                  }
                  
                  return count;
          master_item:
            key: traefik.api.rawdata
          tags:
            - tag: component
              value: router
            - tag: data
              value: api
        - uuid: 034ab8dfcbdc45a9b2b0db9d51374972
          name: 'Traefik: orphan services count'
          type: DEPENDENT
          key: traefik.api.services.orphan.count
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var root = JSON.parse(value);
                  var services = root.services || {};
                  var routers = root.routers || {};
                  
                  var used = {};
                  for (var r in routers) {
                    if (!routers.hasOwnProperty(r)) continue;
                    var svc = routers[r].service;
                    if (svc) used[svc] = true;
                  }
                  
                  var orphan = 0;
                  for (var s in services) {
                    if (!services.hasOwnProperty(s)) continue;
                    if (!used[s]) orphan++;
                  }
                  
                  return orphan;
          master_item:
            key: traefik.api.rawdata
          tags:
            - tag: component
              value: service
            - tag: data
              value: api
        - uuid: df5318a56dca4b45b1ab0e59989aef04
          name: 'Traefik: StripPrefix router coverage ratio'
          type: CALCULATED
          key: traefik.api.stripprefix.coverage.ratio
          history: 30d
          params: '100*last(//traefik.api.routers.using.stripprefix.count)/max(last(//traefik.routers.enabled.count),1)'
          tags:
            - tag: component
              value: router
            - tag: data
              value: calculated
        - uuid: ad1bc592459b458b8e54042a66324e88
          name: 'Traefik: last config reload success flag'
          type: DEPENDENT
          key: traefik.config.reload.last_success
          history: 30d
          value_type: FLOAT
          description: '1 = last config reload succeeded, 0 = last reload failed.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - traefik_config_last_reload_success
                - value
                - ''
          master_item:
            key: traefik.metrics.raw
          tags:
            - tag: component
              value: 'config reload'
            - tag: data
              value: prometheus
        - uuid: fe54432df9dd417cb20cef5988d6ac3b
          name: 'Traefik: config reloads total'
          type: DEPENDENT
          key: traefik.config.reload.total
          history: 30d
          value_type: FLOAT
          description: 'Total number of config reloads in Traefik.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - traefik_config_reloads_total
                - value
                - ''
          master_item:
            key: traefik.metrics.raw
          tags:
            - tag: component
              value: 'config reload'
            - tag: data
              value: prometheus
        - uuid: 1acf1c9f317a44b78a9d6fae052af88a
          name: 'Traefik: Go GC cycles per second'
          type: DEPENDENT
          key: traefik.go.gc.cycles
          history: 7d
          trends: 30d
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - go_gc_duration_seconds_count
                - value
                - ''
            - type: CHANGE_PER_SECOND
          master_item:
            key: traefik.metrics.raw
          tags:
            - tag: component
              value: go
            - tag: data
              value: prometheus
        - uuid: 19e29ed9add5445d8dec569d62ee6db9
          name: 'Traefik: Go GC pause time per second'
          type: DEPENDENT
          key: traefik.go.gc.pause
          history: 7d
          trends: 30d
          units: s/s
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - go_gc_duration_seconds_sum
                - value
                - ''
            - type: CHANGE_PER_SECOND
          master_item:
            key: traefik.metrics.raw
          tags:
            - tag: component
              value: go
            - tag: data
              value: prometheus
        - uuid: fbba28663f524d37aa4d5f2b15b42863
          name: 'Traefik: Go goroutines'
          type: DEPENDENT
          key: traefik.go.goroutines
          history: 7d
          trends: 30d
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - go_goroutines
                - value
                - ''
          master_item:
            key: traefik.metrics.raw
          tags:
            - tag: component
              value: go
            - tag: data
              value: prometheus
        - uuid: 59451ca3513f42ccb7d337ad011c5053
          name: 'Traefik: Go heap allocated'
          type: DEPENDENT
          key: traefik.go.mem.alloc
          history: 7d
          trends: 30d
          units: B
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - go_memstats_alloc_bytes
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (data.length === 0) return 0;
                  return parseFloat(data[0].value);
          master_item:
            key: traefik.metrics.raw
          tags:
            - tag: component
              value: go
            - tag: data
              value: prometheus
        - uuid: 9607ec131751442ba8ccc1d38ddb727b
          name: 'Traefik: Go heap idle'
          type: DEPENDENT
          key: traefik.go.mem.heap_idle
          history: 7d
          trends: 30d
          units: B
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - go_memstats_heap_idle_bytes
                - value
                - ''
          master_item:
            key: traefik.metrics.raw
          tags:
            - tag: component
              value: go
            - tag: data
              value: prometheus
        - uuid: 957cdaeab13f4fab802a96284e0ae7b2
          name: 'Traefik: Go heap in use'
          type: DEPENDENT
          key: traefik.go.mem.heap_inuse
          history: 7d
          trends: 30d
          units: B
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - go_memstats_heap_inuse_bytes
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (data.length === 0) return 0;
                  return parseFloat(data[0].value);
          master_item:
            key: traefik.metrics.raw
          tags:
            - tag: component
              value: go
            - tag: data
              value: prometheus
        - uuid: e732501b9a8f4016bfd0b4711ef7d876
          name: 'Traefik: HTTP incoming bytes per second (all services)'
          type: DEPENDENT
          key: traefik.http.bytes.in
          value_type: FLOAT
          units: Bps
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - traefik_service_requests_bytes_total
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!Array.isArray(data) || data.length === 0) {
                    return 0;
                  }
                  
                  var sum = 0;
                  for (var i = 0; i < data.length; i++) {
                    var v = parseFloat(data[i].value);
                    if (!isNaN(v)) {
                      sum += v;
                    }
                  }
                  return sum;
            - type: CHANGE_PER_SECOND
          master_item:
            key: traefik.metrics.raw
          tags:
            - tag: component
              value: 'http data'
            - tag: component
              value: service
            - tag: data
              value: prometheus
        - uuid: 6706dbb8e8df4a3198544c463446e84a
          name: 'Traefik: HTTP outgoing bytes per second (all services)'
          type: DEPENDENT
          key: traefik.http.bytes.out
          value_type: FLOAT
          units: Bps
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - traefik_service_responses_bytes_total
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!Array.isArray(data) || data.length === 0) {
                    return 0;
                  }
                  
                  var sum = 0;
                  for (var i = 0; i < data.length; i++) {
                    var v = parseFloat(data[i].value);
                    if (!isNaN(v)) {
                      sum += v;
                    }
                  }
                  return sum;
            - type: CHANGE_PER_SECOND
          master_item:
            key: traefik.metrics.raw
          tags:
            - tag: component
              value: 'http data'
            - tag: component
              value: service
            - tag: data
              value: prometheus
        - uuid: c5d8b6619f174e7796133c845039f936
          name: 'Traefik: HTTP 5xx error rate (all services)'
          type: DEPENDENT
          key: traefik.http.errors.5xx.rps
          history: 7d
          value_type: FLOAT
          trends: 30d
          description: 'Overall 5xx error rate (requests per second) across all services.'
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - traefik_service_requests_total
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!Array.isArray(data) || data.length === 0) {
                    return 0;
                  }
                  
                  var sum = 0;
                  
                  for (var i = 0; i < data.length; i++) {
                    var labels = data[i].labels || {};
                    var code = labels.code || "";
                    if (/^5../.test(code)) {
                      var v = parseFloat(data[i].value);
                      if (!isNaN(v)) {
                        sum += v;
                      }
                    }
                  }
                  
                  return sum;
            - type: CHANGE_PER_SECOND
          master_item:
            key: traefik.metrics.raw
          tags:
            - tag: component
              value: 'http data'
            - tag: component
              value: service
            - tag: data
              value: prometheus
          triggers:
            - uuid: 24b9ec5635554e93a637a4893265e1e9
              expression: 'avg(/App Traefik by HTTP/traefik.http.errors.5xx.rps,5m)>{$TRAEFIK.SVC.ERROR.RATE.CRIT}'
              name: 'Traefik: high global 5xx error rate (critical)'
              priority: HIGH
              description: 'Global 5xx error rate is above critical threshold.'
              tags:
                - tag: scope
                  value: error
            - uuid: 56ee632e021045699db0c836a8942663
              expression: 'avg(/App Traefik by HTTP/traefik.http.errors.5xx.rps,5m)>{$TRAEFIK.SVC.ERROR.RATE.WARN}'
              name: 'Traefik: high global 5xx error rate (warning)'
              priority: WARNING
              description: 'Global 5xx error rate is above warning threshold.'
              tags:
                - tag: scope
                  value: error
        - uuid: 4cc2d9617b60442ea839c36012512c7f
          name: 'Traefik: average HTTP request size (global)'
          type: CALCULATED
          key: traefik.http.req.size.avg
          history: 7d
          value_type: FLOAT
          trends: 30d
          units: B
          params: 'last(//traefik.http.bytes.in)/max(last(//traefik.http.requests.rps),1)'
          tags:
            - tag: component
              value: 'http data'
            - tag: data
              value: calculated
        - uuid: 6dfd2f972d044218b51b02f36ecbcf3b
          name: 'Traefik: HTTP requests per second (all services)'
          type: DEPENDENT
          key: traefik.http.requests.rps
          history: 7d
          value_type: FLOAT
          trends: 30d
          description: 'Total HTTP requests per second across all Traefik services.'
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - traefik_service_requests_total
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!Array.isArray(data) || data.length === 0) {
                    return 0;  // nothing yet = no traffic
                  }
                  
                  var sum = 0;
                  
                  for (var i = 0; i < data.length; i++) {
                    var v = parseFloat(data[i].value);
                    if (!isNaN(v)) {
                      sum += v;
                    }
                  }
                  
                  return sum;
            - type: CHANGE_PER_SECOND
          master_item:
            key: traefik.metrics.raw
          tags:
            - tag: component
              value: 'http data'
            - tag: component
              value: service
            - tag: data
              value: prometheus
        - uuid: 75b6dff4f3be45a198d9b72733fec157
          name: 'Traefik: TLS requests per second (all services)'
          type: DEPENDENT
          key: traefik.http.tls.rps
          history: 7d
          value_type: FLOAT
          trends: 30d
          units: req/s
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - traefik_service_requests_tls_total
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!Array.isArray(data) || data.length === 0) {
                    return 0;
                  }
                  var sum = 0;
                  for (var i = 0; i < data.length; i++) {
                    var v = parseFloat(data[i].value);
                    if (!isNaN(v)) {
                      sum += v;
                    }
                  }
                  return sum;
            - type: CHANGE_PER_SECOND
          master_item:
            key: traefik.metrics.raw
          tags:
            - tag: component
              value: go
            - tag: component
              value: 'memory heap'
            - tag: component
              value: service
        - uuid: a6ec39bec26441a1b5fbdfbbd08d039a
          name: 'Traefik: Prometheus /metrics raw'
          type: HTTP_AGENT
          key: traefik.metrics.raw
          history: 1d
          value_type: TEXT
          description: 'Prometheus-style metrics text exposed by Traefik (/metrics).'
          timeout: '{$TRAEFIK.HTTP.TIMEOUT}'
          url: '{$TRAEFIK.METRICS.SCHEME}://{$TRAEFIK.METRICS.HOST}:{$TRAEFIK.METRICS.PORT}{$TRAEFIK.METRICS.PATH}'
          tags:
            - tag: component
              value: api
            - tag: type
              value: raw
        - uuid: 4c08daca78a94083a1a12837abbdffba
          name: 'Traefik: middlewares count'
          type: DEPENDENT
          key: traefik.middlewares.count
          history: 30d
          description: 'Number of middlewares defined in Traefik.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.middlewares
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  return Object.keys(obj).length;
          master_item:
            key: traefik.api.rawdata
          tags:
            - tag: component
              value: middleware
            - tag: data
              value: api
        - uuid: 6ceb9f2b263a4515ba2a6b40653b4379
          name: 'Traefik: middlewares disabled'
          type: DEPENDENT
          key: traefik.middlewares.disabled.count
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var root = JSON.parse(value);
                  var mws = root.middlewares || {};
                  var count = 0;
                  
                  for (var name in mws) {
                    if (!mws.hasOwnProperty(name)) continue;
                    var st = mws[name].status;
                    if (st && st !== "enabled") {
                      count++;
                    }
                  }
                  
                  return count;
          master_item:
            key: traefik.api.rawdata
          tags:
            - tag: component
              value: middleware
            - tag: data
              value: api
        - uuid: 5ca79f5943c54394956ce613c90e80a0
          name: 'Traefik: middlewares enabled'
          type: DEPENDENT
          key: traefik.middlewares.enabled.count
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var root = JSON.parse(value);
                  var mws = root.middlewares || {};
                  var count = 0;
                  
                  for (var name in mws) {
                    if (!mws.hasOwnProperty(name)) continue;
                    if (mws[name].status === "enabled" || mws[name].status === undefined) {
                      count++;
                    }
                  }
                  
                  return count;
          master_item:
            key: traefik.api.rawdata
          tags:
            - tag: component
              value: middleware
            - tag: data
              value: api
        - uuid: cf267872abac494083014199ce015d88
          name: 'Traefik: /ping raw response'
          type: HTTP_AGENT
          key: traefik.ping.raw
          history: '0'
          value_type: CHAR
          description: 'Raw response body from Traefik /ping endpoint (typically "OK").'
          timeout: '{$TRAEFIK.HTTP.TIMEOUT}'
          url: '{$TRAEFIK.API.SCHEME}://{$TRAEFIK.API.HOST}:{$TRAEFIK.API.PORT}{$TRAEFIK.API.PATH}/ping'
          tags:
            - tag: component
              value: api
            - tag: type
              value: raw
        - uuid: 6f8dc614b1ab47689d490033f14a78c2
          name: 'Traefik: health status'
          type: DEPENDENT
          key: traefik.ping.status
          history: 30d
          description: '1 = healthy (/ping returns OK), 0 = unhealthy or invalid response.'
          preprocessing:
            - type: MATCHES_REGEX
              parameters:
                - OK
            - type: BOOL_TO_DECIMAL
          master_item:
            key: traefik.ping.raw
          tags:
            - tag: component
              value: health
            - tag: data
              value: ping
        - uuid: 97460f7fa22f4d0bae4fe5d0b9693f2c
          name: 'Traefik: process CPU usage'
          type: DEPENDENT
          key: traefik.proc.cpu
          history: 7d
          value_type: FLOAT
          trends: 30d
          units: '%'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - process_cpu_seconds_total
                - value
                - ''
            - type: CHANGE_PER_SECOND
            - type: JAVASCRIPT
              parameters:
                - 'return value * 100;'
          master_item:
            key: traefik.metrics.raw
          tags:
            - tag: component
              value: cpu
            - tag: component
              value: process
            - tag: data
              value: prometheus
        - uuid: cb8b084c484a49cdbbfd852a6617bdaf
          name: 'Traefik: max file descriptors'
          type: DEPENDENT
