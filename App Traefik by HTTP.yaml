              name: 'Traefik: TLS requests per second on service {#SERVICE}'
              type: DEPENDENT
              key: 'traefik.service.tls.rps[{#SERVICE}]'
              history: 7d
              value_type: FLOAT
              trends: 30d
              units: req/s
              preprocessing:
                - type: PROMETHEUS_TO_JSON
                  parameters:
                    - traefik_service_requests_tls_total
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var target = '{#SERVICE}';
                      var sum = 0;
                      
                      for (var i = 0; i < data.length; i++) {
                        var labels = data[i].labels || {};
                        if (labels.service === target) {
                          var v = parseFloat(data[i].value);
                          if (!isNaN(v)) sum += v;
                        }
                      }
                      
                      return sum;
                - type: CHANGE_PER_SECOND
              master_item:
                key: traefik.metrics.raw
              tags:
                - tag: component
                  value: traffic
                - tag: data
                  value: prometheus
                - tag: service
                  value: '{#SERVICE}'
          master_item:
            key: traefik.metrics.raw
          lld_macro_paths:
            - lld_macro: '{#SERVICE}'
              path: '$.labels[''service'']'
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - traefik_service_requests_total
            - type: JAVASCRIPT
              parameters:
                - |
                  // value = JSON from PROMETHEUS_TO_JSON
                  var data = JSON.parse(value);
                  var seen = {};
                  var result = [];
                  
                  for (var i = 0; i < data.length; i++) {
                    var s = data[i].labels && data[i].labels.service;
                    if (!s) continue;
                  
                    // only keep first occurrence per service
                    if (!seen[s]) {
                      seen[s] = true;
                      result.push(data[i]);
                    }
                  }
                  
                  return JSON.stringify(result);
        - uuid: cac16dbf8224473ab18a2f5c52436e25
          name: 'Traefik TLS certificates discovery'
          type: DEPENDENT
          key: traefik.tls.discovery
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 3d
          description: 'Discovers TLS certificates from Traefik metrics.'
          item_prototypes:
            - uuid: ef1fdf98d7e140189ef47a726870c362
              name: 'Traefik: TLS certificate days left for {#CN}'
              type: DEPENDENT
              key: 'traefik.tls.cert.days_left[{#CN},{#SERIAL}]'
              history: 30d
              value_type: FLOAT
              units: d
              description: 'Days left before TLS certificate for {#CN} expires.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - traefik_tls_certs_not_after
                    - value
                    - ''
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var notAfter = parseFloat(value);   // epoch seconds
                      var now = Date.now() / 1000;
                      return (notAfter - now) / 86400;    // days left
              master_item:
                key: traefik.metrics.raw
              tags:
                - tag: cn
                  value: '{#CN}'
                - tag: component
                  value: tls
              trigger_prototypes:
                - uuid: b586bb90c519480c86666a8001647153
                  expression: 'min(/App Traefik by HTTP/traefik.tls.cert.days_left[{#CN},{#SERIAL}],1h)<{$TRAEFIK.CERT.DAYS_WARN}'
                  name: 'Traefik: TLS certificate for {#CN} will expire soon (warning)'
                  priority: WARNING
                  description: 'Certificate for {#CN} is close to expiry (warning threshold).'
                  tags:
                    - tag: cn
                      value: '{#CN}'
                    - tag: scope
                      value: security
                - uuid: 54d2ff19820745a4b424dcc0815ca04c
                  expression: 'min(/App Traefik by HTTP/traefik.tls.cert.days_left[{#CN},{#SERIAL}],1h)<{$TRAEFIK.CERT.DAYS_CRIT}'
                  name: 'Traefik: TLS certificate for {#CN} will expire very soon (critical)'
                  priority: HIGH
                  description: 'Certificate for {#CN} is near expiry (critical threshold).'
                  tags:
                    - tag: cn
                      value: '{#CN}'
                    - tag: scope
                      value: security
          master_item:
            key: traefik.metrics.raw
          lld_macro_paths:
            - lld_macro: '{#CN}'
              path: '$.labels[''cn'']'
            - lld_macro: '{#SANS}'
              path: '$.labels[''sans'']'
            - lld_macro: '{#SERIAL}'
              path: '$.labels[''cn'']'
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - traefik_tls_certs_not_after
      tags:
        - tag: class
          value: app
        - tag: source
          value: http-api
        - tag: target
          value: traefik
      macros:
        - macro: '{$TRAEFIK.API.HOST}'
          value: 127.0.0.1
          description: 'Host/IP of Traefik API/dashboard.'
        - macro: '{$TRAEFIK.API.NODATA}'
          value: 5m
          description: 'Time without /api/rawdata considered a problem.'
        - macro: '{$TRAEFIK.API.PATH}'
