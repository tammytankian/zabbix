              type: DEPENDENT
              key: 'traefik.service.backends.count[{#SERVICE}]'
              history: 7d
              trends: 30d
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var root = JSON.parse(value);
                      var svcName = '{#SERVICE}';
                      var services = root.services || {};
