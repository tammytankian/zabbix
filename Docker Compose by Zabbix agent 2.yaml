                      if (!Array.isArray(arr)) return 0;
                      var p = "{#PROJECT}", n = 0;
                      for (var i=0; i<arr.length; i++) {
                        var c = arr[i] || {};
                        var labels = c.Labels || {};
                        if (labels["com.docker.compose.project"] !== p) continue;
                        if ((c.State || "") === "dead") n++;
                      }
                      return n;
              master_item:
                key: docker.containers
              trigger_prototypes:
