          description: 'Base URL for Docker Engine API on this node (plain HTTP)'
        - macro: '{$DOCKER.LLD.INTERVAL}'
          value: 5m
        - macro: '{$DOCKER.STATS.INTERVAL}'
          value: 30s
        - macro: '{$RAWHISTORY}'
          value: 1h
          description: 'How long will keep history for "raw json" items'
