        - uuid: 1d202cc50c6c4c58b1a9898075814d04
          name: 'Traefik: HTTP routers disabled'
          type: DEPENDENT
          key: traefik.routers.disabled.count
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var root = JSON.parse(value);
                  var routers = root.routers || {};
                  var count = 0;
                  
                  for (var name in routers) {
                    if (!routers.hasOwnProperty(name)) continue;
                    if (routers[name].status && routers[name].status !== "enabled") {
                      count++;
                    }
                  }
                  
                  return count;
          master_item:
            key: traefik.api.rawdata
          tags:
            - tag: component
              value: router
            - tag: data
              value: api
        - uuid: 19af7694f2204afa87bab414c505e6e4
          name: 'Traefik: HTTP routers enabled'
          type: DEPENDENT
          key: traefik.routers.enabled.count
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var root = JSON.parse(value);
                  var routers = root.routers || {};
                  var count = 0;
                  
                  for (var name in routers) {
                    if (!routers.hasOwnProperty(name)) continue;
                    if (routers[name].status === "enabled") {
                      count++;
                    }
                  }
                  
                  return count;
          master_item:
            key: traefik.api.rawdata
          tags:
            - tag: component
              value: router
            - tag: data
              value: api
        - uuid: 5af0874c2050497eaa14ffe6cd0b1d6e
          name: 'Traefik: HTTP routers count'
          type: DEPENDENT
          key: traefik.routers.http.count
          history: 30d
          description: 'Number of HTTP routers defined in Traefik.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.routers
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);   // value is the JSON string of the "routers" object
                  return Object.keys(obj).length;
          master_item:
            key: traefik.api.rawdata
          tags:
            - tag: component
              value: router
            - tag: data
              value: api
        - uuid: cd62948f453f426d95be47a9bc80b6ac
          name: 'Traefik: HTTP services disabled'
          type: DEPENDENT
          key: traefik.services.disabled.count
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var root = JSON.parse(value);
                  var services = root.services || {};
                  var count = 0;
                  
                  for (var name in services) {
                    if (!services.hasOwnProperty(name)) continue;
                    var st = services[name].status;
                    if (st && st !== "enabled") {
                      count++;
                    }
                  }
                  
                  return count;
          master_item:
            key: traefik.api.rawdata
          tags:
            - tag: component
              value: service
            - tag: data
              value: api
        - uuid: 35df7b7b048540fdac0a121364418012
          name: 'Traefik: HTTP services enabled'
          type: DEPENDENT
          key: traefik.services.enabled.count
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var root = JSON.parse(value);
                  var services = root.services || {};
                  var count = 0;
                  
                  for (var name in services) {
                    if (!services.hasOwnProperty(name)) continue;
                    if (services[name].status === "enabled" || services[name].status === undefined) {
                      // internal services often omit 'status', treat as enabled
                      count++;
                    }
                  }
                  
                  return count;
          master_item:
            key: traefik.api.rawdata
          tags:
            - tag: component
              value: service
            - tag: data
              value: api
