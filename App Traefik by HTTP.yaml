                  parameters:
                    - traefik_service_server_requests_total
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var svc = '{#SERVICE}';
                      var url = '{#URL}';
                      var sum = 0;
                      
                      for (var i = 0; i < data.length; i++) {
                        var l = data[i].labels || {};
                        var code = l.code || "";
                        if (l.service === svc && l.url === url && /^5../.test(code)) {
