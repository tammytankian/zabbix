zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 9c2e1f69123644a5be8ea034ae4b104c
      name: Templates/Containers
  templates:
    - uuid: fd00a503216147cb99be4e3b8a79cf86
      template: Docker_Compose_by_Zabbix_agent2
      name: 'Docker Compose by Zabbix agent 2'
      description: |
        Compose overlay template (Zabbix 7.4+).
        
        Depends on the official template "Docker by Zabbix agent 2" for the master item:
          - docker.containers (Agent2 Docker plugin ContainerList JSON)
        
        Adds Compose awareness:
          - Project discovery (com.docker.compose.project)
          - Service discovery (project+service)
          - Rollup state counts per project/service: total, running, unhealthy, exited, restarting, paused, dead
          - Published TCP port discovery + local port listening checks (net.tcp.listen[])
      vendor:
        name: Custom
        version: 7.4-3
      templates:
        - name: 'Docker by Zabbix agent 2'
      groups:
        - name: Templates/Containers
      discovery_rules:
        - uuid: c992b2d489a74d65b7557016381e2d90
          name: 'Compose: Published TCP ports discovery'
          type: DEPENDENT
          key: docker.compose.ports.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#PUBPORT}'
                value: '{$COMPOSE.LLD.PORT.MATCHES}'
              - macro: '{#PUBPORT}'
                value: '{$COMPOSE.LLD.PORT.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          lifetime: 30d
          item_prototypes:
            - uuid: 8a169da18def4a77ba32add1fc3b0778
              name: 'Service {#PROJECT}/{#SERVICE}: TCP port {#PUBPORT} listening (local)'
              key: 'net.tcp.listen[{#PUBPORT}]'
              description: '1 if the Docker host is listening on this TCP port, 0 otherwise.'
              trigger_prototypes:
                - uuid: 4abf5b53ee3140589304a44d58159024
                  expression: 'last(/Docker_Compose_by_Zabbix_agent2/net.tcp.listen[{#PUBPORT}]) = 0'
                  name: 'Service {#PROJECT}/{#SERVICE}: TCP port {#PUBPORT} not listening'
                  priority: WARNING
          master_item: {  }
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var arr;
                  try { arr = JSON.parse(value); } catch (e) { return JSON.stringify({data:[]}); }
                  if (!Array.isArray(arr)) return JSON.stringify({data:[]});
                  
                  var seen = {};
                  var out = [];
                  for (var i=0; i<arr.length; i++) {
                    var c = arr[i] || {};
                    var labels = c.Labels || {};
                    var p = labels["com.docker.compose.project"];
                    var s = labels["com.docker.compose.service"];
                    var o = labels["com.docker.compose.oneoff"] || "";
                    if (!p || !s) continue;
                    if ((o || "") === "True") continue;
                  
                    var ports = c.Ports || [];
                    for (var j=0; j<ports.length; j++) {
                      var prt = ports[j] || {};
                      if (!prt.PublicPort) continue;
                      if ((prt.Type || "").toLowerCase() !== "tcp") continue;
                  
                      var pub = String(prt.PublicPort);
                      var k = p + ":" + s + ":" + pub;
                      if (seen[k]) continue;
                      seen[k] = 1;
                  
                      out.push({
                        "{#PROJECT}": p,
                        "{#SERVICE}": s,
                        "{#PUBPORT}": pub
                      });
                    }
                  }
                  
                  return JSON.stringify({data: out});
