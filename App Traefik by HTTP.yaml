            - type: JSONPATH
              parameters:
                - $.services
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  return Object.keys(obj).length;
          master_item:
            key: traefik.api.rawdata
          tags:
            - tag: component
              value: service
            - tag: data
              value: api
      discovery_rules:
        - uuid: b4ea670b27f749378a556c5b1d1204dc
          name: 'Traefik backends discovery'
          type: DEPENDENT
          key: traefik.backend.discovery
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 3d
          item_prototypes:
            - uuid: 5cd0ff6d4e1147a58981cf4d8ba72b8f
              name: 'Traefik: incoming bytes per second on backend {#URL} of service {#SERVICE}'
              type: DEPENDENT
              key: 'traefik.server.bytes.in[{#SERVICE},{#URL}]'
              history: 30d
              value_type: FLOAT
              units: Bps
              preprocessing:
                - type: PROMETHEUS_TO_JSON
                  parameters:
                    - traefik_service_server_requests_bytes_total
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var svc = '{#SERVICE}';
                      var url = '{#URL}';
                      var sum = 0;
                      
                      for (var i = 0; i < data.length; i++) {
                        var l = data[i].labels || {};
                        if (l.service === svc && l.url === url) {
                          var v = parseFloat(data[i].value);
                          if (!isNaN(v)) sum += v;
                        }
                      }
                      return sum;
                - type: CHANGE_PER_SECOND
              master_item:
                key: traefik.metrics.raw
              tags:
                - tag: component
                  value: backend
                - tag: component
                  value: traffic
                - tag: data
                  value: prometheus
                - tag: service
                  value: '{#SERVICE}'
                - tag: url
                  value: '{#URL}'
